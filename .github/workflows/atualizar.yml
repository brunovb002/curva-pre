name: Atualizar curvas

on:
  schedule:
    - cron: "0 13 * * 1-5"  # 10h em Brasília, depois que o BCB publica o CDI da véspera
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      # Refaz o ano de uma semana atrás até hoje, para a virada do ano não ficar sem dados.
      - name: Gerar histórico
        run: python -m curva_pre --atualizar historico --desde "$(date -d '7 days ago' +%Y)"

      - name: Commit
        run: |
          git add historico
          if git diff --cached --quiet -- historico/*[0-9].json; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza curvas até $(python -c "import json; print(json.load(open('historico/indice.json'))['ultima'])")"
          git push
